<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}</style>
<title>Code Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Disposición: cabecera con búsqueda y selector de vista; escenario (canvas) con lentes a la izquierda, minimapa y línea de tiempo; inspector con pestañas a la derecha. En móvil el inspector baja bajo el escenario. */
:root {
  --bg: #0a1016; --stage: #0d141b; --panel: #111a22; --panel2: #16212b; --ink: #dce6ee; --muted: #8696a5; --line: #223140;
  --accent: #6cb0ff; --accent-ink: #06121f; --accent-soft: #14304d; --warn: #ff9366; --warn-soft: #38211a; --ok: #58d39a; --amber: #f0b84a;
  --ground: #131e28; --ground-edge: #243545;
  --c0: #6c9bff; --c1: #3cc9af; --c2: #e7b23e; --c3: #e57dbb; --c4: #a392ff; --c5: #86cf5b; --c6: #d0a46c; --c7: #93aebf;
  --sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6ebef; --stage: #f1f4f6; --panel: #fbfcfd; --panel2: #eff3f5; --ink: #15212b; --muted: #5a6b79; --line: #c9d4dc;
    --accent: #1f5fd1; --accent-ink: #ffffff; --accent-soft: #dae6fa; --warn: #c2410c; --warn-soft: #fbe6da; --ok: #1d7a4a; --amber: #a86a00;
    --ground: #e0e8ee; --ground-edge: #b3c2ce;
    --c0: #3b6fd8; --c1: #178f7c; --c2: #b9810a; --c3: #b4478c; --c4: #6a55d6; --c5: #4a8f2c; --c6: #8a6a3e; --c7: #5f7c8f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e6ebef; --stage: #f1f4f6; --panel: #fbfcfd; --panel2: #eff3f5; --ink: #15212b; --muted: #5a6b79; --line: #c9d4dc;
  --accent: #1f5fd1; --accent-ink: #ffffff; --accent-soft: #dae6fa; --warn: #c2410c; --warn-soft: #fbe6da; --ok: #1d7a4a; --amber: #a86a00;
  --ground: #e0e8ee; --ground-edge: #b3c2ce;
  --c0: #3b6fd8; --c1: #178f7c; --c2: #b9810a; --c3: #b4478c; --c4: #6a55d6; --c5: #4a8f2c; --c6: #8a6a3e; --c7: #5f7c8f;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: 500 10.5px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--panel2); }
.mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding-inline: 16px; padding-block: 10px 16px; }
#top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; font-size: 15px; white-space: nowrap; }
.brand small { font: 400 12px var(--mono); color: var(--muted); }
#crumbs { display: flex; gap: 4px; align-items: center; min-width: 0; flex: 1 1 120px; flex-wrap: nowrap; overflow: hidden; font: 12px var(--mono); color: var(--muted); }
#crumbs button { border: 0; background: none; color: var(--muted); padding: 2px 4px; border-radius: 4px; font: inherit; }
#crumbs button:hover { color: var(--ink); background: var(--panel2); }
.search-trigger { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 220px; padding: 6px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; color: var(--muted); text-align: left; }
.search-trigger:hover { border-color: var(--accent); }
.search-trigger span { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.chip { font: 11px var(--mono); padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); background: var(--panel); white-space: nowrap; }
.chip.live { color: var(--ok); border-color: var(--ok); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.iconbtn:hover { border-color: var(--accent); }

#body { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.drag { cursor: grabbing; }
#cv.hit { cursor: pointer; }
.hud { position: absolute; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
#lens { top: 10px; left: 10px; width: 214px; max-height: calc(100% - 100px); overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
#lens.collapsed .lens-body { display: none; }
#lens h4 { margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
#lens h4 button { border: 0; background: none; color: var(--muted); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field > label { font-size: 11px; color: var(--muted); }
select, input[type=search], input[type=text], textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.chk input { accent-color: var(--accent); }
.legend { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; }
.legend div { display: flex; align-items: center; gap: 7px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
#tools { top: 10px; right: 10px; display: flex; flex-direction: column; padding: 3px; gap: 2px; }
#tools button { width: 30px; height: 30px; border: 0; background: none; border-radius: 6px; font-weight: 700; color: var(--ink); }
#tools button:hover { background: var(--accent-soft); color: var(--accent); }
#mm { position: absolute; right: 10px; bottom: 10px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 90%, transparent); cursor: pointer; }
#tl { left: 10px; right: 198px; bottom: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
#tl .row1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
#tl .info { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
#tl canvas { width: 100%; height: 34px; display: block; cursor: pointer; }
.tbtn { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 2px 9px; font-weight: 700; min-width: 30px; }
.tbtn:hover { border-color: var(--accent); }
#tip { position: absolute; pointer-events: none; z-index: 4; max-width: 280px; padding: 7px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.4; }
#tip b { font-family: var(--mono); }
#toasts { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 6; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 6px 14px; border-radius: 8px; font-size: 12px; }
#empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; color: var(--muted); padding: 24px; }

aside { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 8px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { font: 10px var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 6px; margin-left: 5px; }
#tabbody { overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; min-height: 0; flex: 1; }
section.blk { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
section.blk > h3 { margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 5px 11px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.danger:hover { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .45; cursor: default; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.item { display: flex; flex-direction: column; gap: 3px; padding: 7px 10px; background: var(--panel2); border: 0; border-top: 1px solid var(--line); text-align: left; width: 100%; min-width: 0; }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--accent-soft); }
.item .top { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.tag { font: 10.5px var(--mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.tag.acc { color: var(--accent); border-color: var(--accent); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.amb { color: var(--amber); border-color: var(--amber); }
.pill { font: 600 11px var(--sans); padding: 2px 9px; border-radius: 99px; color: var(--accent-ink); }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.kv > div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--panel2); }
.kv b { display: block; font: 700 15px var(--mono); font-variant-numeric: tabular-nums; }
.kv span { font-size: 10.5px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.title-node { font: 700 16px var(--mono); overflow-wrap: anywhere; }
.chips2 { display: flex; flex-wrap: wrap; gap: 4px; }
.sev { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 5px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.card .act { color: var(--muted); }
.ring { display: flex; align-items: center; gap: 14px; }
.tipbox { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
textarea { font-family: var(--mono); font-size: 11.5px; resize: vertical; min-height: 70px; }

/* código */
.codebox { border: 1px solid var(--line); border-radius: 8px; background: var(--stage); display: flex; min-height: 180px; max-height: 62vh; overflow: auto; position: relative; font: 12px/1.6 var(--mono); }
.codebox .gut { flex: none; text-align: right; color: var(--muted); user-select: none; padding: 8px 6px 8px 10px; position: sticky; left: 0; background: var(--stage); z-index: 1; border-right: 1px solid var(--line); }
.codebox .gut div { display: flex; gap: 6px; justify-content: flex-end; align-items: center; height: 19.2px; }
.codebox .gut i { width: 3px; height: 15px; border-radius: 2px; flex: none; }
.codebox pre { margin: 0; padding: 8px 12px; white-space: pre; tab-size: 2; flex: 1; font: inherit; }
.codebox pre div { height: 19.2px; }
.codebox pre div.hl { background: var(--accent-soft); box-shadow: -12px 0 0 var(--accent-soft), 12px 0 0 var(--accent-soft); }
.codebox a { color: var(--accent); text-decoration: underline dotted; cursor: pointer; }
.k { color: var(--c4); } .s { color: var(--c5); } .c { color: var(--muted); font-style: italic; } .n { color: var(--c2); } .f { color: var(--c0); } .d { color: var(--c3); font-weight: 700; } .t { color: var(--c1); }
.editor { position: relative; flex: 1; min-width: 0; }
.editor pre, .editor textarea { position: absolute; inset: 0; margin: 0; padding: 8px 12px; font: inherit; white-space: pre; tab-size: 2; border: 0; line-height: 19.2px; }
.editor pre { overflow: hidden; pointer-events: none; }
.editor textarea { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; overflow: auto; min-height: 0; border-radius: 0; }
.diff div { white-space: pre; padding: 0 8px; }
.diff .add { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.diff .del { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.diff .hunk { color: var(--accent); }

/* paleta */
#pal { position: fixed; inset: 0; background: rgba(5,10,15,.55); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; z-index: 20; }
#pal .box { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: 70vh; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
#pal input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; font-size: 15px; background: var(--panel); outline: none; }
#pal .res { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px; }
#pal .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 3px; }
#pal .opt { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: 6px; border: 0; background: none; text-align: left; width: 100%; }
#pal .opt[aria-selected="true"] { background: var(--accent-soft); }
#pal .opt .sub { color: var(--muted); font: 11px var(--mono); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
#pal mark { background: none; color: var(--accent); font-weight: 700; }
#pal .foot { border-top: 1px solid var(--line); padding: 7px 14px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; }

@media (max-width: 960px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  #body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
  #tabbody { overflow: visible; }
  .search-trigger { min-width: 0; flex: 1; margin-left: 0; }
  #lens { width: 180px; }
  #lens:not(.collapsed) { max-height: 56%; }
  #mm { display: none; }
  #tl { right: 10px; }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .codebox { max-height: 50vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cmpcol { min-width: 0; overflow-x: auto; font-family: var(--mono); font-size: 11px; background: var(--stage); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.cmpl { white-space: pre; padding: 0 4px; border-radius: 3px; }
.cmpl.diff { background: color-mix(in srgb, var(--warn) 22%, transparent); }
.cmpl .ln { color: var(--muted); display: inline-block; width: 24px; margin-right: 6px; text-align: right; user-select: none; }
aside, #lens, #tl { zoom: var(--ts, 1); }
.simple .adv, #app.simple .adv { display: none !important; }
#lens h4 span { display: inline-flex; gap: 2px; } #lens h4 button { min-width: 22px; }
#uiMode button { padding: 4px 10px; font-size: 12px; } #uiMode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.legend div[data-leg] { cursor: pointer; border-radius: 4px; padding: 1px 3px; margin: 0 -3px; } .legend div[data-leg]:hover { background: var(--accent-soft); }
#tour { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,10,15,.45); z-index: 8; padding: 16px; }
.tourbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; max-width: 440px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.tourbox h3 { margin: 0; font-size: 17px; } .tourbox p { margin: 0; color: var(--ink); line-height: 1.55; }
.navbox { position: relative; display: inline-flex; gap: 4px; }
.navbox .iconbtn { padding: 6px 9px; }
.navbox .iconbtn:disabled { opacity: .4; cursor: default; }
.navlist { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 250px; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.navlist .navh { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 4px 8px; }
.navlist button { display: flex; gap: 8px; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; }
.navlist button:hover { background: var(--accent-soft); }
.navlist button.cur { background: var(--accent); color: var(--accent-ink); }
.navlist button.cur .muted { color: inherit; opacity: .8; }
#top { flex-wrap: nowrap; }
#top .brand { flex: none; white-space: nowrap; }
#proj { display: none; }
#crumbs button { white-space: nowrap; }
#crumbs { flex-basis: 220px; }
@media (max-width: 1500px) { #modeChip:not(.live) { display: none; } }
.search-trigger { flex: 0 1 190px; min-width: 110px; overflow: hidden; white-space: nowrap; }
#modeChip, #btnTheme, #viewSeg, .navbox { flex: none; white-space: nowrap; }
@media (max-width: 980px) { #top { flex-wrap: wrap; } #crumbs { flex-basis: 100%; order: 9; } }
#modeChip:not(.live) { }
.look { right: 58px; top: 10px; width: 330px; max-height: calc(100% - 24px); overflow: auto; padding: 12px; z-index: 12; display: flex; flex-direction: column; gap: 10px; }
.look[hidden] { display: none !important; }
.look h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lk-h { display: flex; justify-content: space-between; align-items: center; }
.lk-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.lk-p { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 6px 8px; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; font-weight: 600; }
.lk-p[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.lk-sw { display: flex; width: 100%; height: 14px; border-radius: 4px; overflow: hidden; }
.lk-sw i { flex: 1; }
.lk-line { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.lk-seg { align-self: stretch; } .lk-seg button { flex: 1; padding: 5px 6px; }
.lk-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
.lk-row input[type=color] { width: 44px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.look details { border-top: 1px solid var(--line); padding-top: 8px; }
.look summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.look .bad { color: var(--warn); }
.lk-foot { display: flex; flex-wrap: wrap; gap: 6px; } .lk-foot textarea { width: 100%; min-height: 70px; }
.lk-foot .muted { width: 100%; font-size: 12px; }
@media (max-width: 760px) { .look { left: 10px; right: 10px; width: auto; } }
</style>

<div id="app">
  <header id="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 17V9l4-2v10M9 17V5l5 2v10M16 17V10l3 1v6" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round"/><path d="M2 18.5h18" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/></svg>
      Code Graph <small id="proj"></small>

function rebuildEdges() {

}
function setWorld(w, keep = false) {
  S.world = w; S.now = Date.parse(w.meta.generated) || Date.now();
  S.nodes = w.nodes.filter((n) => n.kind === 'file'); S.N = Object.fromEntries(S.nodes.map((n) => [n.id, n]));
  S.dirIdx = new Map([...new Set(S.nodes.filter((n) => !n.isTest || true).map((n) => n.dir))].sort().map((d, i) => [d, i]));
  const code = S.nodes.filter((n) => !n.isTest);

  if (!keep) loadExtra();
  for (const [id, note] of Object.entries(S.extra.notes)) if (S.N[id]) S.N[id].note = note;
  rebuildEdges();
  if (S.sel && !S.N[S.sel]) S.sel = null;
  if (S.tl != null && S.tl >= w.timeline.length) S.tl = null;
  Bus.emit('world', keep);

function buildCity() {

    const parts = n.id.split('/'); let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      let nx = cur.dirs.get(parts[i]);
      if (!nx) { nx = { name: parts[i], path: (cur.path ? cur.path + '/' : '') + parts[i], dirs: new Map(), files: [], depth: cur.depth + 1 }; cur.dirs.set(parts[i], nx); }

  const wOf = (d) => (d.w = d.files.reduce((s, n) => s + wf(n), 0) + [...d.dirs.values()].reduce((s, c) => s + wOf(c) * 1.1, 0));

    const items = [...d.dirs.values()].map((c) => ({ kind: 'dir', ref: c, w: c.w * 1.1 })).concat(d.files.map((n) => ({ kind: 'file', ref: n, w: wf(n) })));

        place(it.ref, inner);
      } else { const vm = S.VM.get(it.ref.id), s = clamp(Math.min(r.w, r.h) - 18, 24, 80); vm.city = { x: r.x + r.w / 2, y: r.y + r.h / 2, w: s, d: s }; }
    }
  };
  place(root, { x: -W / 2, y: -H / 2, w: W, h: H });

}

function buildGalaxy() {
  const groups = new Map();
  for (const n of S.nodes) {
    const key = S.group === 'module' ? (n.community >= 0 ? 'm' + n.community : 'solo') : n.dir;
    if (!groups.has(key)) groups.set(key, { key, name: S.group === 'module' ? (n.community >= 0 ? S.world.communities[n.community].name : 'Sin módulo') : n.dir, color: S.group === 'module' ? (n.community >= 0 ? n.community : 7) : S.dirIdx.get(n.dir) ?? 0, members: [] });
    groups.get(key).members.push(n);

function buildPrompt() {
  const w = S.world, code = S.nodes.filter((n) => !n.isTest);
  const outs = new Map(); for (const e of S.edges) if (!e.fromTest) (outs.get(e.source) || outs.set(e.source, []).get(e.source)).push(`${e.kind}${typeof e.card === 'string' && e.card ? ':' + e.card : ''}→${e.target}`);
  const lines = code.map((n) => `- ${n.id} [${n.role}; ${n.state}; riesgo ${n.risk.score}; ${n.coverage === 'ninguna' ? 'sin pruebas' : 'pruebas ' + n.coverage}${n.git?.owner != null ? '; dueño ' + w.authors[n.git.owner] : ''}${n.git ? '; ' + n.git.c90 + ' cambios/90d' : ''}] exports: ${n.exports.join(', ') || '—'}${n.summary ? ' | ' + n.summary : ''}\n    sale: ${(outs.get(n.id) || []).join('; ') || '—'}`);
  return `Eres un analista de arquitectura de software. Te paso el mapa de un proyecto ("${w.meta.root}") extraído automáticamente de sus imports y de su historial de git.

Tareas:
1. Proponer relaciones que el análisis estático NO ve (relaciones de dominio entre entidades, referencias por id o texto, convenciones) con cardinalidad 1:1, 1:N, N:1 o N:M.
2. Dar notas breves sobre archivos importantes.
3. Proponer hasta 5 acciones concretas de mejora, ordenadas por retorno, con el porqué y el esfuerzo (S, M o L).

Reglas:
- Usa SOLO ids de la lista de archivos.
- No repitas aristas que ya existen en "sale".
- Responde ÚNICAMENTE con JSON válido, sin texto extra:
{"edges":[{"source":"<id>","target":"<id>","kind":"relation","card":"1:N","label":"<verbo corto>","reason":"<por qué>"}],
 "notes":{"<id>":"<nota de una línea>"},
 "actions":[{"title":"<acción>","why":"<razón con datos del mapa>","nodes":["<id>"],"effort":"S"}]}

Ciclos: ${w.cycles.map((c) => c.join(' <-> ')).join(' | ') || 'ninguno'}
Cambian juntos sin importarse: ${w.coChange.filter((c) => c.hidden).map((c) => `${c.a} + ${c.b} (${c.count} commits)`).join('; ') || 'ninguno'}
Código duplicado: ${(w.dupes?.groups || []).map((g) => `${g.name}() en ${g.files.join(' + ')} [${g.sev}, ${g.lines} líneas]`).join('; ') || 'ninguno'}
Constantes repetidas: ${(w.dupes?.constants || []).map((c) => `${c.value} ×${c.count}`).join(', ') || 'ninguna'}

Archivos:
${lines.join('\n')}
`;
}
function parseAI(text) {
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/); let t = fence ? fence[1] : text; const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('No encontré un JSON en la respuesta.');
  const j = JSON.parse(t.slice(a, b + 1)); let added = 0, skipped = 0;
  const key = (e) => [e.source, e.target].sort().join('|'), have = new Set(S.edges.filter((e) => e.kind === 'relation').map(key));
  for (const e of j.edges || []) {
    if (!S.N[e.source] || !S.N[e.target] || e.source === e.target || have.has(key(e))) { skipped++; continue; }
    have.add(key(e)); added++;
    S.extra.edges.push({ id: `ai:${e.source}→${e.target}:${S.extra.edges.length}`, source: e.source, target: e.target, kind: 'relation', origin: 'ai', status: 'pending', card: ['1:1', '1:N', 'N:1', 'N:M'].includes(e.card) ? e.card : '', label: String(e.label || '').slice(0, 60), reason: String(e.reason || '').slice(0, 240), symbols: [], refs: 0, lines: [] });
  }
  for (const [id, tx] of Object.entries(j.notes || {})) if (S.N[id] && tx) { S.extra.suggestNotes.push({ id, text: String(tx).slice(0, 240) }); added++; }
  for (const x of j.actions || []) if (x.title) { S.extra.actions.push({ id: 'act' + Date.now() + S.extra.actions.length, title: String(x.title).slice(0, 120), why: String(x.why || '').slice(0, 300), nodes: (x.nodes || []).filter((id) => S.N[id]), effort: String(x.effort || '').slice(0, 2) }); added++; }
  return { added, skipped };
}

  <section class="blk"><h3>Agregar relación a mano</h3>

async function onPanelClick(e) {
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); selectNode(go.dataset.go, { fly: true, line: go.dataset.line ? +go.dataset.line : null }); return; }
  const b = e.target.closest('[data-act]'); if (!b) return; const d = b.dataset;
  switch (d.act) {
    case 'tab': S.tab = d.tab; renderPanel(); break;
    case 'open-code': openCode(d.id, d.line ? +d.line : null); break;
    case 'fly': flyToNode(d.id); break;
    case 'focus-nb': focusNeighborhood(d.id); break;
    case 'focus-module': { const c = S.world.communities[+d.i]; setFocus(c.files, c.name); break; }
    case 'focus-folder': focusFolder(d.path); break;
    case 'focus-ids': setFocus(d.ids.split(',').filter((id) => S.N[id]), d.label); break;
    case 'insight': { const i = S.world.insights.find((x) => x.id === d.id); if (i) { setFocus(i.nodes, i.title); if (i.nodes.length === 1) S.sel = i.nodes[0]; renderCrumbs(); } break; }
    case 'dup-open': S.dupOpen = S.dupOpen === d.id ? null : d.id; S.dupCmp = null; renderPanel(); requestRender(); if (S.dupOpen) loadDupCompare(d.id); break;
    case 'dup-pair': S.dupPair = d.id + ':' + d.i; loadDupCompare(d.id); break;
    case 'ins-filter': S.insightFilter = d.f; renderPanel(); break;
    case 'tl-go': if (S.world.timeline.length) { setTimeline(+d.i); } break;
    case 'trace-sym': traceSymbol(d.id); break;
    case 'trace-clear': S.trace = null; S.path = null; S.pathMsg = ''; renderFocusChip(); renderPanel(); requestRender(); break;
    case 'open-use': { selectNode(d.id, { tab: 'code', fly: true }); const f = S.codeState; await loadCode(d.id); const cs = S.codeState; if (cs?.text) { const rx = new RegExp(`\\b${d.word.replace(/[$]/g, '\\$')}\\b`); const ls = cs.text.split('\n'); const ix = ls.findIndex((l) => rx.test(l) && !/^\s*(import|export)\b.*from/.test(l)); if (ix >= 0) { cs.line = ix + 1; renderPanel(); scrollToLine(); } } break; }
    case 'path-find': {
      const a = $('#pathA').value, bb = $('#pathB').value; S.pathA = a; S.pathB = bb; if (!a || !bb) { S.pathMsg = 'Elige los dos archivos.'; renderPanel(); break; }
      const p = findPath(a, bb); if (p) { S.path = { ids: p }; S.trace = null; S.focusSet = null; S.pathMsg = ''; renderFocusChip(); renderPanel(); fitView(true, p); } else { S.path = null; S.pathMsg = 'No hay camino entre esos dos archivos.'; renderPanel(); } requestRender(); break;
    }
    case 'code-mode': { const cs = S.codeState; if (!cs) break; if (d.mode === 'edit' && !LIVE) break; cs.mode = d.mode; renderPanel(); break; }
    case 'goto-line': { const cs = S.codeState; cs.line = +d.line; if (cs.mode === 'edit') { $('#codebox').scrollTop = (cs.line - 4) * 19.2; } else { scrollToLine(); } break; }
    case 'save': saveCode(); break;
    case 'force-save': saveCode(true); break;
    case 'reload-code': { const id = S.codeState.id; S.codeState.dirty = false; S.codeState.conflict = false; await loadCode(id, null, true); break; }
    case 'copy-prompt': { const ta = $('#promptOut'); await copyText(buildPrompt(), ta); break; }
    case 'sample-ai': S.aiDraft = JSON.stringify(S.world.meta.sampleAI, null, 2); renderPanel(); break;
    case 'import-ai': {
      S.aiDraft = $('#aiIn').value;
      try { const r = parseAI(S.aiDraft); S.aiDraft = ''; saveExtra(); rebuildEdges(); renderPanel(); requestRender(); $('#aiMsg').textContent = `${r.added} sugerencia(s) nuevas, ${r.skipped} omitidas`; }
      catch (err) { $('#aiMsg').textContent = 'No pude leer el JSON: ' + err.message; }
      break;
    }
    case 'accept': { const x = S.extra.edges.find((y) => y.id === d.id); if (x) { x.status = 'accepted'; saveExtra(); rebuildEdges(); renderPanel(); requestRender(); } break; }
    case 'accept-all': S.extra.edges.forEach((x) => { if (x.status === 'pending') x.status = 'accepted'; }); saveExtra(); rebuildEdges(); renderPanel(); requestRender(); break;
    case 'reject': { const i = S.extra.edges.findIndex((y) => y.id === d.id); if (i >= 0) { S.extra.edges.splice(i, 1); saveExtra(); rebuildEdges(); renderPanel(); requestRender(); } break; }

    case 'reject-note': S.extra.suggestNotes.splice(+d.i, 1); saveExtra(); renderPanel(); break;
    case 'drop-action': S.extra.actions = S.extra.actions.filter((x) => x.id !== d.id); saveExtra(); renderPanel(); break;
    case 'add-rel': {
      const s = $('#mSrc').value, t = $('#mDst').value; if (s === t) { toast('Elige dos archivos distintos'); break; }
      S.extra.edges.push({ id: `m:${s}→${t}:${S.extra.edges.length}`, source: s, target: t, kind: 'relation', origin: 'manual', status: 'accepted', card: $('#mCard').value, label: $('#mLabel').value.trim(), symbols: [], refs: 0, lines: [] });

    case 'clear-extra': S.extra = { edges: [], notes: {}, suggestNotes: [], actions: [] }; for (const n of S.nodes) delete n.note; saveExtra(); rebuildEdges(); renderPanel(); requestRender(); break;
  }
}

}
function dataLine(n) {

  const fx = g.fixes ? `${g.fixes} de ${g.commits} commits son correcciones (${Math.round(g.fixRate.lo * 100)}–${Math.round(g.fixRate.hi * 100)}%)` : 'sin commits de corrección';

}

/* ── contraste (WCAG) ── */
const lum = (c) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };

const CHECKS = [['ink', 'stage', 4.5, 'Texto sobre el mapa'], ['ink', 'panel', 4.5, 'Texto en paneles'], ['muted', 'panel', 4.5, 'Texto suave en paneles'], ['muted', 'stage', 4.5, 'Nombres de barrios'], ['accent', 'panel', 3, 'Acento'], ['warn', 'panel', 3, 'Advertencia'], ['ok', 'panel', 3, 'Correcto'], ['accent-ink', 'accent', 4.5, 'Texto sobre el acento'], ['ground', 'stage', 1.1, 'Suelo visible']];
const curTokens = () => { const cs = getComputedStyle(document.documentElement); return Object.fromEntries(TOKEN_KEYS.map((k) => [k, cs.getPropertyValue('--' + k).trim()])); };
function contrastReport() { const t = curTokens(); return CHECKS.map(([a, b, min, label]) => { const r = ratio(hex(t[a]), hex(t[b])); return { a, b, min, label, r, ok: r >= min }; }); }
function fixContrast(a, b, min) { // acerca el color a blanco o negro hasta cumplir
  const t = curTokens(), bg = hex(t[b]); let c = hex(t[a]); const toward = lum(bg) < 0.5 ? [255, 255, 255] : [0, 0, 0];
  for (let i = 0; i < 40 && ratio(c, bg) < min; i++) c = mixc(c, toward, 0.08);
  Look.s.tokens[a] = toHex(c);
}

/* ── aplicar ── */
function applyLook(save = true) {
  const root = document.documentElement, s = Look.s, p = PRESETS[s.preset];

  for (const k of Object.keys(STATE_META)) root.style.removeProperty('--st-' + k);
  for (let i = 0; i < 4; i++) root.style.removeProperty('--risk' + i);
  if (p) { root.dataset.theme = p.dark ? 'dark' : 'light'; for (const k of TOKEN_KEYS) root.style.setProperty('--' + k, p.t[k]); } else delete root.dataset.theme;
  for (const [k, v] of Object.entries(s.tokens)) root.style.setProperty('--' + k, v);

  if (s.risk) s.risk.forEach((v, i) => root.style.setProperty('--risk' + i, v));

function openLook(v = !Look.open) { Look.open = v; $('#look').hidden = !v; if (v) renderLook(); }
function initLook() {

    case 'set-savereg': { const name = ($('#setRegName')?.value || '').trim(), ids = rg.byMask.get(S.sets.region) || []; if (!name || !ids.length) { toast('Elige una región y ponle nombre'); return; } S.setStore.custom[name] = ids.slice(); saveSetStore(); toast('Conjunto «' + name + '» guardado: ya está en el catálogo'); renderPanel(); break; }
    case 'set-delcustom': delete S.setStore.custom[d.k]; saveSetStore(); S.sets.keys = S.sets.keys.filter((k) => k !== 'saved:' + d.k); setsRecompute(); renderPanel(); requestRender(); break;
    case 'set-ask': { const ids = rg.byMask.get(S.sets.region) || []; setFocus(ids, 'Región elegida'); S.tab = 'ask'; runAsk('¿qué es lo más riesgoso?'); break; }
  }
}
function drawSetBlobs() { // manchas translúcidas bajo los archivos de cada conjunto; donde se cruzan, los colores se mezclan
  const st = S.sets; if (!st.show || !st.keys.length) return; const city = S.mode === 'city';
  st.ids.forEach((ids, i) => {
    if (ids.size > 2500) return; const col = T.pal[i % 8];
    for (const id of ids) {
      const vm = S.VM.get(id); if (!vm || !vm.vis) continue; const p = proj(vm.x, vm.y, 0), r = (city ? Math.max(vm.city.w, vm.city.d) * CAM.k * 1.5 : Math.max(3, vm.sz * CAM.k) * 2) + 34;
      if (!onScr(p[0], p[1], r)) continue; aura(p[0], p[1], r, r * (city ? 0.55 * Math.max(0.5, CAM.tilt + 0.3) : 1), col, T.dark ? 0.55 : 0.5);
    }
  });
}
function drawSetMarks() { // fichas de color sobre cada archivo del conjunto (una por conjunto), para reconocer pertenencia a simple vista
  const st = S.sets; if (!st.show || !st.keys.length) return; const city = S.mode === 'city';
  for (const vm of S.VM.values()) {
    if (!vm.vis) continue; let n = 0; const hits = []; st.ids.forEach((ids, i) => { if (ids.has(vm.n.id)) hits.push(i); }); if (!hits.length) continue;
    const p = proj(vm.x, vm.y, city ? vm.h : 0); if (!onScr(p[0], p[1], 30)) continue; const r = 4.2, y = p[1] - (city ? 7 : Math.max(3, vm.sz * CAM.k) + 7), x0 = p[0] - ((hits.length - 1) * 9) / 2;
    for (const i of hits) { ctx.beginPath(); ctx.arc(x0 + n * 9, y, r, 0, 7); ctx.fillStyle = css(T.pal[i % 8], 1); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = css(T.stage, 0.95); ctx.stroke(); n++; }
  }
}
function initSets() {
  const b = $('#tabbody'); b.addEventListener('click', onSetsClick);
  b.addEventListener('change', (e) => {
    if (e.target.id === 'setAdd' && e.target.value) { if (!S.sets.keys.includes(e.target.value)) { S.sets.keys.push(e.target.value); S.sets.recipe = null; S.sets.reading = ''; setsRecompute(); setFocus(null, '', false); renderPanel(); requestRender(); } }
    else if (e.target.id === 'setBlobs') { S.sets.show = e.target.checked; requestRender(); }
  });
  if (S.world) loadSetStore();
  Bus.on('world', () => { setCat = null; loadSetStore(); if (S.sets.keys.length) setsRecompute(); });
}

/* ───────────────────────── qa.js · Preguntar, caminar por el código, vistas rápidas, modo Simple ───────────────────────── */
const UIPREF = (() => { try { return JSON.parse(localStorage.getItem('codegraph:ui') || '{}'); } catch { return {}; } })();
const saveUiPref = () => { try { localStorage.setItem('codegraph:ui', JSON.stringify(UIPREF)); } catch {} };

/* ═══════════ Preguntar (Q2–Q4) ═══════════ */
S.qa = { text: '', ans: null };
const askWorld = QA.ask, suggestQs = QA.suggest, QS = QA.QUESTIONS, evidenceTxt = QA.evidenceText;
const CONF_TAG = { alta: 'ok', media: 'amb', baja: 'warn' };
function runAsk(text, opts = {}) { S.qa.text = text; S.qa.ans = askWorld(S.world, text, { sel: S.sel, ...opts }); if (S.qa.ans.file && S.N[S.qa.ans.file]) { /* mantiene el archivo mencionado */ } renderPanel(); }
function tabAsk() {
  const a = S.qa.ans, sug = suggestQs(S.world, S.sel);
  const chips = sug.map((s, i) => `<button class="btn small" data-act="qa-q" data-i="${i}">${esc(s.text)}</button>`).join('');
  let ans = '';
  if (a) {
    const ids = a.rows.map((r) => r.id).filter((id) => id && S.N[id]);
    ans = `<section class="blk"><div class="card"><div class="muted" style="font-size:11.5px">${esc(a.title)}</div><div style="font-size:14.5px;font-weight:600;line-height:1.4">${esc(a.headline)}</div>
      <div class="row wrap"><span class="tag ${CONF_TAG[a.conf.level]}" title="${esc(a.conf.why)}">Confianza ${esc(a.conf.level)}</span><span class="muted" style="font-size:11.5px">${esc(a.conf.why)}</span></div></div></section>
      ${a.rows.length ? `<section class="blk"><h3>Evidencia (${a.rows.length})</h3><div class="list">${a.rows.map((r) => r.id && S.N[r.id] ? `<button class="item" data-go="${esc(r.id)}"><span class="top"><span class="sw" style="background:${css(dirColor(S.N[r.id].dir))}"></span><span class="mono grow">${esc(stem(S.N[r.id]))}</span>${r.tag ? `<span class="tag">${esc(r.tag)}</span>` : ''}</span><span class="muted" style="font-size:11.5px">${esc(r.text)}</span></button>` : `<div class="item"><span style="font-size:12px">${esc(r.text)}</span></div>`).join('')}</div>
        <div class="row wrap">${ids.length ? `<button class="btn small" data-act="qa-focus">Mostrar en el mapa</button>` : ''}<button class="btn small" data-act="qa-copy" title="Copia pregunta, datos, confianza y límites para pegarlos en una IA">Copiar evidencia para la IA</button></div></section>` : ''}
      ${a.challenge.length ? `<section class="blk"><h3>Cuestiónala</h3><ul class="steps">${a.challenge.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></section>` : ''}
      ${a.follow?.length && a.id !== 'none' ? `<section class="blk"><h3>Para seguir</h3><div class="chips2">${a.follow.map((id) => { const q = QS.find((x) => x.id === id); return q ? `<button class="btn small" data-act="qa-id" data-id="${esc(id)}">${esc(q.title)}</button>` : ''; }).join('')}</div></section>` : ''}`;
  }
  return `<section class="blk"><h3>Pregunta a tus datos</h3><div class="row"><input type="text" id="qaq" placeholder="${S.sel ? 'p. ej. ¿qué se rompe si cambio ' + esc(stem(S.N[S.sel])) + '?' : 'p. ej. ¿qué es lo más riesgoso?'}" value="${esc(S.qa.text)}" autocomplete="off"><button class="btn primary" data-act="qa-go">Preguntar</button></div>
    <div class="chips2">${chips}</div>${a ? '' : tipBox('Cada respuesta viene con <b>evidencia</b> (archivos y números), un nivel de <b>confianza</b> y los <b>límites</b> para cuestionarla. Nada se inventa: si no hay datos, lo dice.')}</section>${ans}`;
}
function onQaClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return; const d = b.dataset;
  switch (d.act) {
    case 'qa-go': runAsk($('#qaq').value); break;
    case 'qa-q': { const s = suggestQs(S.world, S.sel)[+d.i]; if (s) runAsk(s.text, { id: s.id, file: s.file }); break; }
    case 'qa-id': { const q = QS.find((x) => x.id === d.id); if (q) runAsk(q.title, { id: q.id, file: S.qa.ans?.file || undefined }); break; }
    case 'qa-focus': { const ids = [...new Set(S.qa.ans.rows.map((r) => r.id).filter((id) => id && S.N[id]))]; setFocus(ids, S.qa.ans.title); break; }
    case 'qa-copy': { const t = evidenceTxt(S.qa.ans); (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast('Evidencia copiada'), () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Evidencia copiada'); } catch { toast('No se pudo copiar'); } ta.remove(); }); break; }
  }
}

/* ═══════════ Caminar por el código (N2) ═══════════ */
function walkTo(id, why) { if (!id || !S.N[id]) { toast('No hay a dónde ir desde aquí'); return; } selectNode(id, { fly: true }); toast(why + ' ' + stem(S.N[id])); }
const strongest = (list, pick) => list.filter((e) => !e.external && !e.fromTest && S.N[pick(e)]?.kind === 'file' && e.kind !== 'relation').sort((a, b) => (b.refs || 0) - (a.refs || 0))[0];
function siblings(id) { const n = S.N[id]; return S.nodes.filter((x) => x.kind === 'file' && x.dir === n.dir).sort((a, b) => a.id.localeCompare(b.id)); }
function stepList(list, id, dir) { const i = list.findIndex((x) => x.id === id); return list[(i + dir + list.length) % list.length]?.id; }
function onWalkKey(e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable || e.ctrlKey || e.metaKey || e.altKey || !S.world) return;
  const k = e.key, sel = S.sel; let handled = true;
  if (e.shiftKey && k === 'ArrowRight') { if (!sel) return; const x = strongest(S.out.get(sel) || [], (e) => e.target); walkTo(x?.target, 'Depende de'); }
  else if (e.shiftKey && k === 'ArrowLeft') { if (!sel) return; const x = strongest(S.inn.get(sel) || [], (e) => e.source); walkTo(x?.source, 'Lo usa'); }
  else if (e.shiftKey && (k === 'ArrowDown' || k === 'ArrowUp')) { if (!sel || S.N[sel].kind !== 'file') return; walkTo(stepList(siblings(sel), sel, k === 'ArrowDown' ? 1 : -1), 'Vecino en la carpeta:'); }
  else if (!e.shiftKey && (k === 'j' || k === 'k')) {
    const list = (S.focusSet ? [...S.focusSet].map((i) => S.N[i]).filter((n) => n?.kind === 'file') : S.nodes.filter((n) => n.kind === 'file' && !n.isTest)).sort((a, b) => S.focusSet ? a.id.localeCompare(b.id) : (b.risk?.score || 0) - (a.risk?.score || 0));
    if (!list.length) return; const i = list.findIndex((n) => n.id === sel); walkTo(list[sel ? (i + (k === 'j' ? 1 : -1) + list.length) % list.length : 0].id, S.focusSet ? 'Siguiente del grupo:' : 'Por riesgo:');
  }
  else if (!e.shiftKey && k === 'u') { if (!sel) return; const dir = S.N[sel].dir; if (!dir || dir === '(raíz)' || dir === '(externo)') { setFocus(null); fitView(true); return; } focusFolder(dir); toast('Carpeta ' + dir); }
  else handled = false;
  if (handled) { e.preventDefault(); e.stopImmediatePropagation(); }
}

/* ═══════════ Vistas rápidas (U3) y leyenda que aísla ═══════════ */
const VIEW_PRESETS = {
  calmado: { label: 'Calmado', color: 'folder', size: 'lines', layers: { streets: true, all: false, tunnels: false, dupes: false, cycles: false, labels: true, anim: false } },
  analisis: { label: 'Análisis', color: 'risk', size: 'lines', layers: { streets: true, all: false, tunnels: true, dupes: true, cycles: true, labels: true, anim: false } },
  detective: { label: 'Detective', color: 'impact', size: 'fanin', layers: { streets: true, all: true, tunnels: true, dupes: true, cycles: true, labels: true, anim: false } },
};
function applyPreset(id) {
  const p = VIEW_PRESETS[id]; if (!p) return; S.lens.color = p.color; S.lens.size = p.size; Object.assign(S.layers, p.layers);
  const map = { streets: '#lyStreets', all: '#lyAll', tunnels: '#lyTunnels', dupes: '#lyDupes', cycles: '#lyCycles', labels: '#lyLabels', anim: '#lyAnim' };
  for (const [k, sel] of Object.entries(map)) $(sel).checked = !!S.layers[k];
  applySizes(false); syncLens(); requestRender(); UIPREF.preset = id; saveUiPref(); const s = $('#lensPreset'); if (s) s.value = id; toast('Vista: ' + p.label);
}
function legendIsolate(i) {
  const items = legendItems(), sw = items[i]?.[0]; if (!sw) return;
  const ids = S.nodes.filter((n) => n.kind === 'file' && css(colorOf0(n)) === sw).map((n) => n.id);
  if (!ids.length) { toast('Este color es parte de un gradiente: no agrupa archivos'); return; }
  if (S.focusSet && S.focusLabel === items[i][1]) { setFocus(null); fitView(true); return; }
  setFocus(ids, items[i][1]);
}

/* ═══════════ Modo Simple / Completo y bienvenida (U4) ═══════════ */
const SIMPLE_LENS = ['folder', 'state', 'risk'];
function setUiMode(m) {
  UIPREF.mode = m; saveUiPref(); document.body.classList.toggle('simple', m === 'simple');
  const root = $('#app') || document.body; root.classList.toggle('simple', m === 'simple');
  $$('#lensColor option').forEach((o) => { o.hidden = m === 'simple' && !SIMPLE_LENS.includes(o.value); });
  if (m === 'simple' && !SIMPLE_LENS.includes(S.lens.color)) { S.lens.color = 'state'; syncLens(); requestRender(); }
  if (m === 'simple' && ['trace', 'ai'].includes(S.tab)) { S.tab = 'summary'; renderPanel(); }
  $$('#uiMode button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === m));
}
const TOUR = [
  ['Esto es tu código como una ciudad', 'Cada edificio es un archivo; las manzanas son carpetas. Altura = tamaño, color = lo que elijas en «Color por». Arrastra para moverte, rueda para acercar, <kbd>Q</kbd>/<kbd>E</kbd> para girar.'],
  ['Pregunta en vez de buscar', 'Abre la pestaña <b>Preguntar</b> y haz preguntas como «¿qué es lo más riesgoso?» o «¿qué se rompe si cambio orderService?». Cada respuesta trae evidencia, confianza y cómo cuestionarla.'],
  ['Muévete sin perderte', 'Cada paso queda en el historial: ◀ ▶ arriba (o <kbd>Alt</kbd>+flechas). <kbd>Shift</kbd>+→ sigue una dependencia, <kbd>Shift</kbd>+← a quien lo usa, <kbd>J</kbd>/<kbd>K</kbd> recorren por riesgo, <kbd>U</kbd> sube a la carpeta. <kbd>Ctrl K</kbd> busca todo.'],
  ['Hazlo cómodo', 'En <b>Aspecto</b> cambias colores y tamaño del texto. En «Vista rápida» eliges Calmado, Análisis o Detective. Con modo <b>Simple</b> ves solo lo esencial; cambia a Completo cuando quieras.'],
];
let tourI = 0;
function openTour(i = 0) {
  tourI = i; let el = $('#tour'); if (!el) { el = document.createElement('div'); el.id = 'tour'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Bienvenida'); $('#stage').appendChild(el); el.addEventListener('click', onTourClick); }
  const [h, t] = TOUR[i]; el.hidden = false;
  el.innerHTML = `<div class="tourbox"><div class="muted" style="font-size:11px">${i + 1} de ${TOUR.length}</div><h3>${h}</h3><p>${t}</p><div class="row"><button class="btn small" data-t="skip">Cerrar</button><span class="grow"></span>${i ? '<button class="btn small" data-t="prev">Atrás</button>' : ''}<button class="btn primary small" data-t="${i < TOUR.length - 1 ? 'next' : 'skip'}">${i < TOUR.length - 1 ? 'Siguiente' : 'Empezar'}</button></div></div>`;
}
function onTourClick(e) { const b = e.target.closest('[data-t]'); if (!b) return; const t = b.dataset.t; if (t === 'next') openTour(tourI + 1); else if (t === 'prev') openTour(tourI - 1); else { $('#tour').hidden = true; UIPREF.toured = true; saveUiPref(); } }

/** «desde la última vez»: compara con la foto guardada en este navegador y guarda la actual */
function initSince() {
  const key = () => 'codegraph:last:' + (S.world?.meta?.root || '');
  Bus.on('world', () => {
    if (S.sinceKey !== key()) {
      S.sinceKey = key(); S.sinceBase = null;
      try { S.sinceBase = JSON.parse(localStorage.getItem(key()) || 'null'); } catch {}
      try { localStorage.setItem(key(), JSON.stringify(QA.snapshotOf(S.world))); } catch {}
    }
    S.world.since = S.sinceBase ? QA.diffSince(S.sinceBase, S.world, ago(S.sinceBase.t)) : null;
  });
}
function sinceBlock() {
  const d = S.world.since; if (!d) return '';
  if (d.empty) return '';
  const row = (id, txt, tag) => `<button class="item" data-go="${esc(id)}"><span class="top"><span class="mono grow">${esc(short(S.N[id] || { id, label: id }))}</span><span class="tag">${esc(tag)}</span></span><span class="muted" style="font-size:11px">${esc(txt)}</span></button>`;
  const items = [...d.newRisk.slice(0, 4).map((x) => row(x.id, `riesgo ${x.from} → ${x.to}`, 'sube')), ...d.added.slice(0, 3).map((id) => row(id, 'archivo nuevo', 'nuevo')), ...d.states.slice(0, 3).map((x) => row(x.id, `${x.from} → ${x.to}`, 'estado'))];
  return `<section class="blk"><h3>Desde tu última visita (${esc(d.when)})</h3><div class="muted">${d.added.length} nuevos · ${d.removed.length} borrados · ${d.newRisk.length} con más riesgo · ${d.states.length} cambiaron de estado${d.health != null ? ` · salud ${d.health > 0 ? '+' : ''}${d.health}` : ''}</div><div class="list">${items.join('')}</div></section>`;
}
function initExplore() {
  initSince();
  $('#tabbody').addEventListener('click', onQaClick);
  $('#tabbody').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'qaq') { e.preventDefault(); runAsk(e.target.value); } });
  document.addEventListener('keydown', onWalkKey, true);
  $('#lensPreset').onchange = (e) => applyPreset(e.target.value);
  $('#legend').addEventListener('click', (e) => { const d = e.target.closest('[data-leg]'); if (d) legendIsolate(+d.dataset.leg); });
  $('#uiMode').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (b) setUiMode(b.dataset.m); });
  $('#btnHelp').onclick = () => openTour(0);
  if (UIPREF.mode) setUiMode(UIPREF.mode); else setUiMode('full');
  if (UIPREF.preset && VIEW_PRESETS[UIPREF.preset]) $('#lensPreset').value = UIPREF.preset;
  if (!UIPREF.toured && S.world) setTimeout(() => openTour(0), 600);
}

boot();
})();
</script>
